name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / bunny ${{ matrix.bunny }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0.6"
        bunny:
          - "3.1.0"
          - "latest"

    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RABBITMQ__HOST: localhost
      RABBITMQ__PORT: 5672

    steps:
      - uses: actions/checkout@v4
      - name: Pin bunny
        if: matrix.bunny != 'latest'
        run: echo "gem 'bunny', '${{ matrix.bunny }}'" >> Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
